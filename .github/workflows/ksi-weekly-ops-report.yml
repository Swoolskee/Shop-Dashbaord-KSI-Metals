name: KSI Weekly Operations Report

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ksi-weekly-ops-report.yml"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests openpyxl
      - name: Generate November 2-6 weekly report
        env:
          KATANA_API_KEY: ${{ secrets.Auto_Refresh_Katana }}
          WEEK_START: "2026-11-02"
        run: python scripts/generate_weekly_ops.py
      - name: Archive report in GitHub
        run: |
          git config user.name "KSI Reporting Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/Weekly_Ops_Report_2026-11-02.xlsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "KSI weekly operations report November 2-6"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: KSI-Weekly-Ops-Nov-2-6
          path: reports/Weekly_Ops_Report_2026-11-02.xlsx
          retention-days: 90
