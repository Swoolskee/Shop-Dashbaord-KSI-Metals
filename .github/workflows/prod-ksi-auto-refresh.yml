name: Prod KSI Auto Refresh

on:
  schedule:
    # Arizona shop-floor refresh cadence.
    # Arizona is UTC-7 year-round (no DST), so 13:42-22:42 UTC = 6:42 AM-3:42 PM America/Phoenix.
    # Run weekdays only (Monday-Friday). First successful run at 6:42 AM snapshots Goal Today; later runs preserve it.
    - cron: "42 13-22 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prod-ksi-auto-refresh.yml"
      - "scripts/update_prod_dashboard.py"

permissions:
  contents: write

concurrency:
  group: prod-ksi-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out dashboard repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify Katana secret exists
        env:
          KATANA_API_KEY: ${{ secrets.Auto_Refresh_Katana }}
        run: |
          if [ -z "$KATANA_API_KEY" ]; then
            echo "Auto_Refresh_Katana repository secret is missing."
            exit 1
          fi

      - name: Refresh Prod KSI data
        env:
          KATANA_API_KEY: ${{ secrets.Auto_Refresh_Katana }}
        run: python scripts/update_prod_dashboard.py

      - name: Commit refreshed dashboard data
        run: |
          if git diff --quiet -- docs/dashboard-data.json; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git config user.name "Prod KSI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard-data.json
          git commit -m "Auto refresh Prod KSI dashboard"
          git push origin HEAD:main
