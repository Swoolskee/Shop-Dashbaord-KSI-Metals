name: Prod KSI Auto Refresh

on:
  schedule:
    # Arizona is UTC-7 year-round.
    # 7:00 AM snapshot, hourly 8:00 AM-3:00 PM, final 3:30 PM refresh.
    - cron: "0 14 * * *"
    - cron: "0 15-22 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prod-ksi-auto-refresh.yml"
      - "scripts/update_prod_dashboard.py"

permissions:
  contents: write

concurrency:
  group: prod-ksi-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out dashboard repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify Katana secret exists
        env:
          KATANA_API_KEY: ${{ secrets.KATANA_API_KEY }}
        run: |
          if [ -z "$KATANA_API_KEY" ]; then
            echo "KATANA_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Refresh Prod KSI data
        env:
          KATANA_API_KEY: ${{ secrets.KATANA_API_KEY }}
        run: python scripts/update_prod_dashboard.py

      - name: Commit refreshed dashboard data
        run: |
          if git diff --quiet -- docs/dashboard-data.json; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git config user.name "Prod KSI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard-data.json
          git commit -m "Auto refresh Prod KSI dashboard"
          git push origin HEAD:main
